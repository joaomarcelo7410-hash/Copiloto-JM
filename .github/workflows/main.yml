
name: Gerar APK Copiloto JM

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto
        run: |
          unzip -q Copiloto_JM_v0_3_OCR_corrigido.zip -d projeto

      - name: Encontrar projeto Android
        run: |
          find projeto -name settings.gradle -o -name settings.gradle.kts

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          PROJECT_DIR=$(find projeto -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)
          echo "Projeto encontrado em: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Copiloto-JM-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
