name: Gerar APK Copiloto JM

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto
        run: |
          unzip -q Copiloto_JM_v0_3_OCR_corrigido.zip -d projeto

      - name: Localizar projeto
        run: |
          PROJECT_DIR=$(find projeto -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Configurar Java e Kotlin para JVM 1.8
        run: |
          cd "$PROJECT_DIR"

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.copilotojm.app'
              compileSdk 35

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              defaultConfig {
                  applicationId 'com.copilotojm.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '0.1.0'
              }
          }

          dependencies {
              implementation 'com.google.mlkit:text-recognition:16.0.1'
              implementation 'androidx.core:core:1.15.0'
          }

          tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = '1.8'
              targetCompatibility = '1.8'
          }
          GRADLE

          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            'kotlin.jvm.target.validation.mode=error' \
            > gradle.properties

          echo "=== CONFIGURAÇÃO JAVA ==="
          grep -n "sourceCompatibility\|targetCompatibility" app/build.gradle

          echo "=== CONFIGURAÇÃO KOTLIN ==="
          grep -n "jvmTarget" app/build.gradle

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Copiloto-JM-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
